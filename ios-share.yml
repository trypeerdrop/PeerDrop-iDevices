targets:
  PeerDrop-iOS-Share:
    type: app-extension
    supportedDestinations: [iOS]
    deploymentTarget:
      iOS: 16.0
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.foss.peerdrop.share
        INFOPLIST_FILE: app/iOS-Share/Info.plist
        SWIFT_COMPILATION_MODE: wholemodule
    entitlements:
      path: app/iOS-Share/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.to.foss.peerdrop
    sources:
      - path: app/iOS-Share-Extension
        type: group
      - path: app/shared/Sources/AppGroup.swift
      - path: app/shared/Sources/Models/PeerDevice.swift
